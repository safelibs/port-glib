[package]
name = "safe-glib"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
c2rust-asm-casts = "0.20"
c2rust-bitfields = "0.20"
f128 = "0.2"
libc = "0.2"
num-traits = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
